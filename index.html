<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body onload="addTabImage()">

    <div id="image">
        Hover over an image below to display here.
    </div>

     
    <img class="preview" alt="TSUNAMI" src="images/tsunami.webp" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="TORNADO" src="images/tornado.avif" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="THUNDERSTORM" src="images/thuder.webp" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="SANDSTORM" src="images/sandstorm.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="VOLCANO" src="images/firemountain.webp" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    
    <img class="preview" alt="FLOOD" src="images/Flood.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    
</body>
</html>
